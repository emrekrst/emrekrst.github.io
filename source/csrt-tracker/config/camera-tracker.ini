[camera]
width=2028
height=1080
fps=50
sensor_depth=12
exposure_us=5000
gain_mode=auto
analogue_gain=1.0

[tracking]
use_hog=true
use_color_names=true
use_gray=true
use_rgb=false
use_channel_weights=true
use_segmentation=true
template_size=200
padding=3
number_of_scales=33
scale_step=1.02
admm_iterations=4
psr_threshold=0.035

